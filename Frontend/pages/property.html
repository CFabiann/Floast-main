<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floast - Propiedad</title>
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/property.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="prop-header">
    <div class="header-left">
      <a href="dashboard.html" class="btn-back" aria-label="Volver al dashboard">
        <i data-lucide="arrow-left"></i>
      </a>
      <div class="header-prop-info">
        <div class="header-breadcrumb">
          <span class="breadcrumb-home">Mis Propiedades</span>
          <i data-lucide="chevron-right" class="breadcrumb-sep"></i>
          <span class="breadcrumb-current" id="headerPropName">—</span>
        </div>
        <div class="header-meta" id="headerMeta">
          <!-- tipo · ubicación · N unidades — se llena con JS -->
        </div>
      </div>
    </div>

    <div class="header-right">
      <span class="prop-status-badge" id="propStatusBadge"></span>
      <button class="btn-icon" id="btnEditProp" title="Editar propiedad">
        <i data-lucide="pencil"></i>
      </button>
    </div>
  </header>

  <!-- ── Loading ─────────────────────────────────────────────── -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
  </div>

  <!-- ── Main ────────────────────────────────────────────────── -->
  <main class="prop-main" id="propMain" hidden>

    <!-- ── Caso: propiedad con múltiples unidades ── -->
    <div id="multiView">

      <!-- Tabs de unidades -->
      <div class="units-bar" id="unitsBar" role="tablist" aria-label="Unidades de la propiedad">
        <!-- generado por JS -->
      </div>

      <!-- Panel de detalle de la unidad seleccionada -->
      <div class="unit-detail" id="unitDetail">
        <p class="unit-empty-msg">Selecciona una unidad para ver sus detalles.</p>
      </div>
    </div>

    <!-- ── Caso: propiedad de una sola unidad (casa/depto) ── -->
    <div id="singleView" hidden>
      <div class="unit-detail" id="singleDetail"></div>
    </div>

    <!-- ── Sección de Reseñas de Inquilinos ── -->
    <section class="detail-card full-width reviews-section" id="reviewsSection">
      <div class="reviews-header">
        <div>
          <span class="detail-card-title">
            <i data-lucide="message-square-quote"></i> Reseñas de Inquilinos
          </span>
          <div class="reviews-summary" id="reviewsSummary">
            <span class="reviews-avg" id="reviewsAvg">—</span>
            <div class="reviews-stars" id="reviewsStars"></div>
            <span class="reviews-count" id="reviewsCount">(0 opiniones)</span>
          </div>
        </div>

        <!-- Botón visible solo si el usuario logueado es inquilino de esta propiedad -->
        <button class="btn-submit" id="btnOpenReviewModal" hidden>
          <i data-lucide="star" style="width:14px;height:14px;margin-right:4px"></i>
          Calificar mi experiencia
        </button>

        <!-- Aviso informativo para visitantes o usuarios que no son inquilinos -->
        <span class="tenant-only-badge" id="tenantOnlyNotice">
          <i data-lucide="shield-check"></i> Solo inquilinos verificados pueden opinar
        </span>
      </div>

      <!-- Lista de reseñas -->
      <div class="reviews-list" id="reviewsList">
        <!-- Se llena dinámicamente con JS -->
      </div>

      <!-- Paginación de reseñas -->
      <div class="reviews-pagination" id="reviewsPagination" hidden>
        <button type="button" class="btn-secondary" id="btnPrevReviews">Anteriores</button>
        <span class="page-indicator" id="reviewsPageIndicator">Página 1</span>
        <button type="button" class="btn-secondary" id="btnNextReviews">Siguientes</button>
      </div>
    </section>

  </main>

  <!-- ── Modal: editar propiedad ─────────────────────────────── -->
  <div class="modal-overlay" id="modalEditProp" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editPropTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="editPropTitle">Editar Propiedad</h3>
        <button class="modal-close" id="editPropClose" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="editPropForm" class="modal-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="ePropName">Nombre</label>
            <input type="text" id="ePropName" required>
            <span class="error-message" id="ePropNameError"></span>
          </div>
          <div class="form-group">
            <label for="ePropLocation">Ubicación</label>
            <input type="text" id="ePropLocation" required>
            <span class="error-message" id="ePropLocationError"></span>
          </div>
        </div>
        <div class="form-group" id="ePropPriceGroup">
          <label for="ePropPrice">Renta mensual global ($)</label>
          <input type="number" id="ePropPrice" min="0">
        </div>
        <div class="form-group">
          <label for="ePropStatus">Estado</label>
          <select id="ePropStatus" required>
            <option value="disponible">Disponible</option>
            <option value="rentada">Rentada</option>
            <option value="mantenimiento">En mantenimiento</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ePropDescription">Descripción general</label>
          <textarea id="ePropDescription" rows="3" placeholder="Describe el inmueble..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editPropCancel">Cancelar</button>
          <button type="submit" class="btn-submit" id="editPropSubmit">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!--MODAL EDITAR INQUILINO COMPLETO-->
  <div class="modal-overlay" id="modalEditTenantSingle" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTenantSingleTitle">

      <div class="modal-header">
        <h3 class="modal-title" id="editTenantSingleTitle">Editar Inquilino</h3>
        <button class="modal-close" id="editTenantSingleClose" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="editTenantSingleForm" class="modal-form" novalidate>

        <div class="form-group">
          <label for="eSingleTenantName">Nombre del inquilino (déjalo vacío para eliminar)</label>
          <input type="text" id="eSingleTenantName" placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="eSingleTenantPhone">Teléfono</label>
            <input type="tel" id="eSingleTenantPhone" placeholder="Ej. 555-1234">
          </div>
          <div class="form-group">
            <label for="eSingleTenantEmail">Correo electrónico</label>
            <input type="email" id="eSingleTenantEmail" placeholder="Ej. juan@correo.com">
          </div>
        </div>

        <div class="form-group">
          <label for="eSingleLeaseEnd">Fin del contrato</label>
          <input type="date" id="eSingleLeaseEnd">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editTenantSingleCancel">Cancelar</button>
          <button type="submit" class="btn-submit" id="editTenantSingleSubmit">Guardar Inquilino</button>
        </div>

      </form>
    </div>
  </div>

  <!--MODAL EDITAR INQUILINO POR UNIDAD-->
  <div class="modal-overlay" id="modalEditTenantUnit" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTenantUnitTitle">

      <div class="modal-header">
        <h3 class="modal-title" id="editTenantUnitTitle">Editar Inquilino de Unidad</h3>
        <button class="modal-close" id="editTenantUnitClose" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="editTenantUnitForm" class="modal-form" novalidate>
        <input type="hidden" id="eUnitTenantId">

        <div class="form-group">
          <label for="eUnitTenantName">Nombre del inquilino (déjalo vacío para eliminar)</label>
          <input type="text" id="eUnitTenantName" placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="eUnitTenantPhone">Teléfono</label>
            <input type="tel" id="eUnitTenantPhone" placeholder="Ej. 555-1234">
          </div>
          <div class="form-group">
            <label for="eUnitTenantEmail">Correo electrónico</label>
            <input type="email" id="eUnitTenantEmail" placeholder="Ej. juan@correo.com">
          </div>
        </div>

        <div class="form-group">
          <label for="eUnitLeaseEnd">Fin del contrato</label>
          <input type="date" id="eUnitLeaseEnd">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editTenantUnitCancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar Inquilino</button>
        </div>

      </form>
    </div>
  </div>

  <!-- ── Modal: editar unidad ────────────────────────────────── -->
  <div class="modal-overlay" id="modalEditUnit" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="editUnitTitle">Editar Unidad</h3>
        <button class="modal-close" id="editUnitClose" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="editUnitForm" class="modal-form" novalidate>
        <input type="hidden" id="editUnitId">
        <div class="form-row">
          <div class="form-group">
            <label for="eUnitLabel">Nombre / Número</label>
            <input type="text" id="eUnitLabel" placeholder="Ej. 2A, Cuarto 3" required>
            <span class="error-message" id="eUnitLabelError"></span>
          </div>
          <div class="form-group">
            <label for="eUnitStatus">Estado</label>
            <select id="eUnitStatus">
              <option value="disponible">Disponible</option>
              <option value="rentada">Rentada</option>
              <option value="mantenimiento">En mantenimiento</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eUnitPrice">Renta mensual ($)</label>
            <input type="number" id="eUnitPrice" min="0" placeholder="0">
            <span class="error-message" id="eUnitPriceError"></span>
          </div>
          <div class="form-group">
            <label for="eUnitArea">Área (m²) — opcional</label>
            <input type="number" id="eUnitArea" min="0" placeholder="Ej. 45">
          </div>
        </div>
        <div class="form-group">
          <label for="eUnitDesc">Descripción de la unidad</label>
          <textarea id="eUnitDesc" rows="2" placeholder="Describe la habitación o local..."></textarea>
        </div>

        <p class="section-sub">Inquilino actual</p>
        <div class="form-row">
          <div class="form-group">
            <label for="eTenantName">Nombre completo</label>
            <input type="text" id="eTenantName" placeholder="Juan García López">
          </div>
          <div class="form-group">
            <label for="eTenantPhone">Teléfono</label>
            <input type="tel" id="eTenantPhone" placeholder="+52 1234567890" inputmode="tel">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eTenantEmail">Correo electrónico</label>
            <input type="email" id="eTenantEmail" placeholder="inquilino@email.com">
          </div>
          <div class="form-group">
            <label for="eLeaseEnd">Vencimiento del contrato</label>
            <input type="date" id="eLeaseEnd">
          </div>
        </div>
        <div class="form-group">
          <label for="eUnitNotes">Notas adicionales</label>
          <textarea id="eUnitNotes" rows="2" placeholder="Observaciones, acuerdos, etc."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="editUnitCancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar Unidad</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal: Nueva Reseña (Inquilino Verificado) ──────────── -->
  <div class="modal-overlay" id="modalReview" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
      <div class="modal-header">
        <h3 class="modal-title" id="reviewModalTitle">Calificar mi experiencia</h3>
        <button class="modal-close" id="reviewModalClose" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="reviewForm" class="modal-form" novalidate>
        <!-- Selector de Estrellas -->
        <div class="form-group">
          <label>Calificación general</label>
          <div class="star-rating-select" id="starSelector" role="radiogroup" aria-label="Calificación de 1 a 5 estrellas">
            <button type="button" class="star-btn" data-value="1" aria-label="1 estrella"><i data-lucide="star"></i></button>
            <button type="button" class="star-btn" data-value="2" aria-label="2 estrellas"><i data-lucide="star"></i></button>
            <button type="button" class="star-btn" data-value="3" aria-label="3 estrellas"><i data-lucide="star"></i></button>
            <button type="button" class="star-btn" data-value="4" aria-label="4 estrellas"><i data-lucide="star"></i></button>
            <button type="button" class="star-btn" data-value="5" aria-label="5 estrellas"><i data-lucide="star"></i></button>
          </div>
          <span class="error-message" id="reviewRatingError"></span>
        </div>

        <!-- Etiquetas rápidas (Chips) -->
        <div class="form-group">
          <label>¿Qué destacarías del inmueble? (Opcional)</label>
          <div class="review-tags-selector" id="reviewTagsSelector">
            <button type="button" class="tag-chip" data-tag="Agua constante">💧 Agua constante</button>
            <button type="button" class="tag-chip" data-tag="Internet estable">📶 Internet estable</button>
            <button type="button" class="tag-chip" data-tag="Zona segura">🔒 Zona segura</button>
            <button type="button" class="tag-chip" data-tag="Ambiente tranquilo">🔇 Ambiente tranquilo</button>
            <button type="button" class="tag-chip" data-tag="Buen trato del arrendador">🤝 Buen trato del arrendador</button>
            <button type="button" class="tag-chip" data-tag="Buena ubicación comercial">🏪 Buena ubicación comercial</button>
          </div>
        </div>

        <!-- Comentario -->
        <div class="form-group">
          <label for="reviewComment">Tu reseña</label>
          <textarea id="reviewComment" rows="3" placeholder="Comparte cómo ha sido vivir o tener tu negocio aquí..." required></textarea>
          <span class="error-message" id="reviewCommentError"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="reviewModalCancel">Cancelar</button>
          <button type="submit" class="btn-submit" id="reviewSubmitBtn">Publicar Reseña</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="../scripts/property.js"></script>
</body>

</html>
